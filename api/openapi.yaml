openapi: 3.1.0
info:
  title: Sepia REST API
  version: 0.1.0
  description: >
    The plain-request half of Sepia. Sessions and the entry card travel over the WebSocket
    (api/events.schema.json); everything here is a page that refreshes, a list, or an action that must survive a
    reload. All of it sits behind the same Host and Origin checks as the socket, and every reply carries
    Cache-Control: no-store and the deny-all CSP (docs/STANDARDS.md 4, 6).
  license:
    name: MIT
servers:
  - url: https://lepotato.taild95077.ts.net:8893
    description: The potato, over the tailnet
  - url: http://localhost:8893
    description: The same service on loopback

security: []

paths:
  /healthz:
    get:
      summary: Liveness for the watcher, Meridian and the operator
      operationId: getHealth
      responses:
        "200":
          description: The service is up. Exactly two fields, by design.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/sessions:
    post:
      summary: Create a session before connecting the socket
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSession" }
      responses:
        "201":
          description: Created. The socket URL is where the conversation happens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      summary: List sessions, newest first. state=active is the Drafts list; kind=general is past chats
      operationId: listSessions
      parameters:
        - { name: state, in: query, schema: { $ref: "#/components/schemas/SessionState" } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/SessionKind" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of sessions
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Session" } }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/sessions/{id}:
    get:
      summary: One session, including its draft state
      operationId: getSession
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/sessions/{id}/media:
    post:
      summary: Upload a screenshot to a session (Phase 3)
      operationId: uploadMedia
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, contentMediaType: image/png, maxLength: 10485760 }
      responses:
        "201":
          description: Stored, and ready to attach to a message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /api/entries:
    get:
      summary: The library, newest finished first unless a sort says otherwise
      operationId: listEntries
      parameters:
        - { name: medium, in: query, schema: { $ref: "#/components/schemas/Medium" } }
        - { name: favourite, in: query, schema: { type: boolean } }
        - { name: work, in: query, schema: { type: string, maxLength: 128 } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/LibrarySort" } }
        - name: deleted
          in: query
          description: >-
            false is the library, which hides deleted entries. true is the Deleted list, which holds only them. A
            deleted entry is never paged with the entries that are still there.
          schema: { type: boolean, default: false }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Entry" } }
                  next_cursor: { type: [string, "null"] }

  /api/entries/{id}:
    get:
      summary: One entry with its work and its answers
      description: >-
        A deleted entry is answered with 200 and its deleted_at set, not with 404: a link followed after a delete is
        how she reaches the way back. A draft is answered with 404, because a draft is read through its session.
      operationId: getEntry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/entries/{id}/revisions:
    get:
      summary: The append-only history of an entry, newest first
      operationId: listRevisions
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Revision" } }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/entries/{id}/delete:
    post:
      summary: Soft-delete an entry. There is no hard delete and no purge
      operationId: deleteEntry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Marked deleted. The row stays, forever }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/entries/{id}/restore:
    post:
      summary: Put a deleted entry back in the library. Nothing was erased, so nothing is rebuilt
      operationId: restoreEntry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Back in the library. The row never left storage }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/works/{id}:
    get:
      summary: One work, with every source that contributed to it
      operationId: getWork
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/search:
    get:
      summary: Search the operator's own words, titles and answers
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/export:
    post:
      summary: Write a JSON export of every work and review
      operationId: exportAll
      responses:
        "202":
          description: An export is being written; poll the returned job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/version:
    get:
      summary: The running version and how updates are doing
      operationId: getVersion
      responses:
        "200":
          description: Version, deployment and updater state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }

  /api/services:
    get:
      summary: Reachability of every optional dependency, for the Services screen
      operationId: getServices
      responses:
        "200":
          description: One entry per dependency
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services: { type: array, items: { $ref: "#/components/schemas/ServiceStatus" } }

  /api/settings:
    get:
      summary: The few things she can change from the Settings screen
      operationId: getSettings
      responses:
        "200":
          description: The current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      summary: Change the settings. The whole object, so a partial write cannot leave half a switch
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Stored, and this is what is now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /api/update/check:
    post:
      summary: Ask the host watcher to look for a newer image
      operationId: updateCheck
      responses:
        "202": { description: The watcher was signalled }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/update/available:
    get:
      summary: What the watcher last found
      operationId: updateAvailable
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateAvailable" }

  /api/update/start:
    post:
      summary: Ask the watcher to install the latest image. Refused while a reply is being written
      operationId: updateStart
      responses:
        "202": { description: The watcher was signalled }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/update/status:
    get:
      summary: The last update's result
      operationId: updateStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }

  /api/restart:
    post:
      summary: "Restart only: no pull, no rebuild"
      operationId: restart
      responses:
        "202": { description: The watcher was signalled }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
      description: >-
        Opaque. Never an offset. It belongs to the query that made it: a cursor from another sort or another set
        of filters is refused with invalid_value rather than answering a page from somewhere else.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    BadRequest:
      description: The request was refused. The body is the error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such thing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The action cannot happen now, and the reason says why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Over a documented limit.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status: { const: ok }
        version: { type: string }
      additionalProperties: false

    Error:
      description: The one error shape. code is stable and the UI maps it to its own copy.
      type: object
      required: [code, message]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        message: { type: string, minLength: 1, maxLength: 500 }
        detail: { type: string, maxLength: 2000 }
      additionalProperties: false

    Medium:
      enum: [film, tv, book, game, album, podcast, theatre, other]

    LibrarySort:
      description: >-
        newest is finished_on then id, both descending. rating is rating_q descending, then finished_on and id, so
        the order is total and a page never repeats or skips a row.
      enum: [newest, rating]
      default: newest

    Settings:
      description: >-
        Every switch on the Settings screen that is not decided in config. Off means the step does not run, not
        that it failed.
      type: object
      required: [preread]
      properties:
        preread:
          description: >-
            The quick read that routes a message and skips questions she already answered. Off sends every message
            straight to the agent, with no notice: it was her choice.
          type: boolean
          default: true
      additionalProperties: false

    SessionKind:
      enum: [entry, general]

    SessionState:
      enum: [active, saved, discarded]

    CreateSession:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/SessionKind" }
        title: { type: string, maxLength: 300 }
      additionalProperties: false

    Session:
      type: object
      required: [id, kind, state, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/SessionKind" }
        state: { $ref: "#/components/schemas/SessionState" }
        title: { type: string, maxLength: 300 }
        entry_id: { type: [string, "null"] }
        draft_version: { type: [integer, "null"], minimum: 0 }
        waiting_reason:
          description: The first thing the draft is waiting on, in the order the Drafts list checks them.
          type: [string, "null"]
          enum: [pick_work, needs_rating, needs_body, accept_fields, needs_date, ready, null]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

    Media:
      type: object
      required: [id, kind, created_at]
      properties:
        id: { type: string }
        kind: { enum: [source_screenshot, photo] }
        created_at: { type: string, format: date-time }
      additionalProperties: false

    Creator:
      type: object
      required: [role, name]
      properties:
        role: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 200 }
      additionalProperties: false

    Work:
      type: object
      required: [id, medium, title, verified]
      properties:
        id: { type: string }
        medium: { $ref: "#/components/schemas/Medium" }
        title: { type: string, maxLength: 500 }
        original_title: { type: string, maxLength: 500 }
        year: { type: integer, minimum: 0, maximum: 9999 }
        creators: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Creator" } }
        cover_url: { type: [string, "null"], maxLength: 2000 }
        verified: { type: boolean }
        primary_provider: { type: string, maxLength: 64 }
        primary_id: { type: string, maxLength: 128 }
      additionalProperties: false

    WorkDetail:
      # Written out rather than allOf Work, because Work refuses additional properties and a schema cannot add
      # "sources" to a closed object. The contract test validates both, so the two cannot drift in shape.
      type: object
      required: [id, medium, title, verified, sources]
      properties:
        id: { type: string }
        medium: { $ref: "#/components/schemas/Medium" }
        title: { type: string, maxLength: 500 }
        original_title: { type: string, maxLength: 500 }
        year: { type: integer, minimum: 0, maximum: 9999 }
        creators: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Creator" } }
        cover_url: { type: [string, "null"], maxLength: 2000 }
        verified: { type: boolean }
        primary_provider: { type: string, maxLength: 64 }
        primary_id: { type: string, maxLength: 128 }
        sources:
          type: array
          items:
            type: object
            required: [provider, trust]
            properties:
              provider: { type: string }
              provider_id: { type: string }
              trust: { enum: [verified, unverified, accepted] }
              fetched_at: { type: string, format: date-time }
              citations:
                type: array
                items:
                  type: object
                  required: [url]
                  properties:
                    url: { type: string, maxLength: 2000 }
                    snippet: { type: string, maxLength: 2000 }
                  additionalProperties: false
            additionalProperties: false
      additionalProperties: false

    Entry:
      type: object
      required: [id, work, rating_q, rating_scale, favourite, body, body_origin, status, created_at, updated_at]
      properties:
        id: { type: string }
        work: { $ref: "#/components/schemas/Work" }
        rating_q: { type: integer, minimum: 1, maximum: 20 }
        rating_scale: { const: quarter_stars_20 }
        favourite: { type: boolean }
        verdict: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 8000 }
        body_origin: { enum: [extracted, typed, mixed, imported] }
        status: { enum: [draft, saved] }
        format: { type: [string, "null"], maxLength: 32 }
        finished_on: { type: [string, "null"], format: date }
        season: { type: [integer, "null"], minimum: 1 }
        answers:
          type: array
          items:
            type: object
            required: [question_id, prompt, answer_type, values]
            properties:
              question_id: { type: string }
              category: { type: string }
              prompt: { type: string }
              answer_type: { enum: [tags, choice, short_text] }
              values: { type: array, items: { type: string } }
              skipped: { type: boolean }
            additionalProperties: false
        tags:
          type: array
          items:
            type: object
            required: [name, source]
            properties:
              name: { type: string }
              source: { enum: [genre, mine] }
            additionalProperties: false
        deleted_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false

    Revision:
      type: object
      required: [id, entry_id, revision, created_at]
      properties:
        id: { type: string }
        entry_id: { type: string }
        revision: { type: integer, minimum: 1 }
        snapshot: { $ref: "#/components/schemas/Entry" }
        created_at: { type: string, format: date-time }
      additionalProperties: false

    SearchHit:
      type: object
      required: [kind, id, title, snippet]
      properties:
        kind: { enum: [entry, work, chat] }
        id: { type: string }
        title: { type: string, maxLength: 500 }
        snippet: { type: string, maxLength: 500 }
        score: { type: number }
      additionalProperties: false

    ExportJob:
      type: object
      required: [id, started_at]
      properties:
        id: { type: string }
        started_at: { type: string, format: date-time }
        path: { type: [string, "null"] }
      additionalProperties: false

    VersionInfo:
      type: object
      required: [version, deployment, updater]
      properties:
        version: { type: string }
        deployment: { enum: [docker, bare] }
        updater:
          type: object
          required: [state]
          properties:
            state: { enum: [ready, not_installed, stale] }
            heartbeat_at: { type: [string, "null"], format: date-time }
          additionalProperties: false
      additionalProperties: false

    ServiceStatus:
      type: object
      required: [name, state]
      properties:
        name: { enum: [database, decisions, polaris, tmdb, open_library, r2] }
        state: { enum: [ok, degraded, down, not_configured] }
        detail: { type: string, maxLength: 300 }
      additionalProperties: false

    UpdateAvailable:
      type: object
      required: [check_pending]
      properties:
        available:
          type: object
          required: [current, update_available]
          properties:
            current: { type: string }
            latest: { type: string }
            latest_digest: { type: string }
            checked_at: { type: string, format: date-time }
            update_available: { type: boolean }
          additionalProperties: false
        check_pending: { type: boolean }
      additionalProperties: false

    UpdateStatus:
      type: object
      required: [pending]
      properties:
        pending: { type: boolean }
        result:
          type: object
          required: [status, finished_at]
          properties:
            status: { enum: [ok, failed, skipped] }
            detail: { type: string, maxLength: 1000 }
            target: { type: string, maxLength: 200 }
            finished_at: { type: string, format: date-time }
          additionalProperties: false
      additionalProperties: false
