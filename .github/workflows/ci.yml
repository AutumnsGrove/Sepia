name: ci

# Every check Sepia's main branch requires. Runs on a push to main and on every pull request; from S13 the
# branch ruleset requires pull requests, and until then a push reports here within the run
# (docs/CI.md 4.6). On a public repository: least privilege, actions pinned by commit, no secrets anywhere.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod
  GOTOOLCHAIN: local

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Check formatting
        run: |
          go run mvdan.cc/gofumpt@v0.12.0 -l $(git ls-files '*.go') | tee /tmp/fmt
          test ! -s /tmp/fmt
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: Race tests
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Compile for the potato
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/sepia

  nocgo:
    name: nocgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Build with cgo off
        run: CGO_ENABLED=0 go build ./...
      - name: No dependency may need cgo
        env:
          CGO_ENABLED: '0'
        run: |
          if go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./... | grep -v '^$'; then
            echo "::error::a dependency needs cgo; Sepia is pure Go"
            exit 1
          fi
          echo "nocgo: nothing of ours needs cgo"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - name: Critical packages must stay covered
        run: |
          set -euo pipefail
          # Output is not hidden: a failing test must be readable in the log, not just an exit code.
          go test -count=1 -coverprofile=/tmp/cover.out ./...
          go tool cover -func=/tmp/cover.out | tail -1
          # The floors are statement coverage per package, the same number `go test -cover` prints, and they live in
          # tools/covercheck with a test of their own (docs/CI.md 1). Generated packages are excluded inside the
          # tool, and a package with no statements at all is an error rather than a zero.
          go run ./tools/covercheck -profile=/tmp/cover.out

  drift:
    name: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Regenerate everything derived from api/
        run: make gen
      - name: Fail on a diff
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::generated code is out of date. Run 'make gen' and commit the result."
            exit 1
          fi
          echo "drift: the contract and its generated code agree"

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          # The app lives in web/, so the action is told where its package.json is and which pnpm to use.
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:unit
      - name: Build into a scratch directory
        run: pnpm run build
      - name: Size budget
        run: |
          set -euo pipefail
          bytes=$(du -sb build | cut -f1)
          echo "build is $bytes bytes"
          # A skeleton with one page has no business near a megabyte. Raise this deliberately, with a reason.
          if [ "$bytes" -gt 2000000 ]; then
            echo "::error::the frontend build is over 2 MB"
            exit 1
          fi

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build the frontend into the embed directory
        working-directory: .
        run: make web
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run the end-to-end suite
        run: pnpm exec playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The guard script
        run: bash scripts/guard.sh all

  deps:
    name: deps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The extractor runs the module's own Go. Without this it uses the runner image's, and with GOTOOLCHAIN=local
      # a go.mod asking for a newer version makes autobuild fail for every project.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
