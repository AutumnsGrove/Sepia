name: docker-publish

# One image per commit on main, multi-arch, pushed to GHCR and consumed by the host watcher (docs/UPDATE.md).
# The version is r<commit count>.<short sha>, the same shape Polaris and Warbler use, so the health reply, the image
# label and the annotation the watcher reads all name the same build.
#
# Actions are pinned by full commit sha (docs/CI.md 4.3). Nothing here touches the potato: the watcher pulls.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Queue instead of cancelling: an interrupted multi-arch push can leave a partial manifest on GHCR.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit count is part of the version, so the shallow default clone is not enough.
          fetch-depth: 0

      - name: Compute the version
        id: vars
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          count="$(git rev-list --count HEAD)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=r${count}.${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # arm64 is the potato; amd64 keeps a dev machine able to run the same image. The Dockerfile pins its
          # web and Go stages to $BUILDPLATFORM, so only the final stage is per-architecture.
          platforms: linux/amd64,linux/arm64
          push: true
          # The moving tag is deliberately not set here. It is moved after Trivy passes, because the watcher
          # resolves :latest and would otherwise install an image that failed the scan. The version tag is
          # immutable and not what an update resolves.
          tags: |
            ghcr.io/autumnsgrove/sepia:${{ steps.vars.outputs.version }}
          # The watcher reads this index annotation to name the version it found without pulling the image.
          annotations: |
            index:org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          labels: |
            org.opencontainers.image.title=Sepia
            org.opencontainers.image.description=A private review journal
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the arm64 image before anyone can pull it
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/autumnsgrove/sepia@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Only now does the moving tag point at this build. A failed scan leaves :latest on the last image that
      # passed, so the watcher's hourly check cannot report an unscanned digest as an update.
      - name: Point latest at the scanned image
        id: latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=${{ steps.vars.outputs.version }}" \
            --tag ghcr.io/autumnsgrove/sepia:latest \
            "ghcr.io/autumnsgrove/sepia@${{ steps.build.outputs.digest }}"
          # Moving the tag writes a new index manifest, so its digest is not the build's. This is the digest the
          # watcher will resolve from :latest, and therefore the one .env must pin; a different one would look like
          # an update forever. The hash of the raw manifest is the digest by definition, and it avoids parsing the
          # human output. Never let awk exit early here: closing the pipe while inspect is still writing is a
          # SIGPIPE, and pipefail turns that into a failed publish after the tag has already moved.
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/autumnsgrove/sepia:latest --raw |
            sha256sum | awk '{print $1}')"
          test -n "$digest"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Sepia ${{ steps.vars.outputs.version }}"
            echo
            echo "Pinned reference for .env (the digest :latest resolves to):"
            echo
            echo '```'
            echo "ghcr.io/autumnsgrove/sepia@${{ steps.latest.outputs.digest }}"
            echo '```'
            echo
            echo "The immutable version tag for this build is ghcr.io/autumnsgrove/sepia:${{ steps.vars.outputs.version }}."
          } >> "$GITHUB_STEP_SUMMARY"
